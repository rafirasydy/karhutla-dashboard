version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-karhutla
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: streamlit-karhutla
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/postgres
    depends_on:
      - db
